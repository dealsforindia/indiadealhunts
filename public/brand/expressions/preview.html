<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Individual expression frames</title><style>body{margin:0;background:#15251f;color:#edf4ea;font:16px system-ui;display:grid;justify-items:center;gap:16px;padding:24px}img{height:65vh;max-width:90vw;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#293b32 0 25%,#1b2c23 0 50%) 0/24px 24px}select,button,input{font:inherit;padding:10px}nav{display:flex;gap:12px;flex-wrap:wrap}p{max-width:600px;line-height:1.5;color:#bacbbf}</style><h1>Expression frame review</h1><nav><select aria-label="Expression" id="expression"></select><button id="play">Pause</button><label>Frame <input aria-label="Frame" id="frame" type="range" min="1" max="15" value="1"><output id="number">1 / 15</output></label></nav><img id="actor" alt="Individual character animation frame"><p>15 independently generated images per expression. This review does not certify smoothness or registration. Scrub to inspect head, hands, clothing and feet. The originals remain separate PNG files.</p><script>const names=['wave','surprise','thinking','celebration','looking_down','sunglasses'];const select=document.querySelector('#expression'),slider=document.querySelector('#frame'),actor=document.querySelector('#actor'),number=document.querySelector('#number');for(const name of names){const o=new Option(name.replace('_',' '),name);select.add(o)}let frame=1,playing=!matchMedia('(prefers-reduced-motion:reduce)').matches;function draw(){actor.src=select.value+'/'+String(frame).padStart(2,'0')+'.png';slider.value=frame;number.textContent=frame+' / 15'}select.onchange=()=>{frame=1;draw()};slider.oninput=()=>{playing=false;document.querySelector('#play').textContent='Play';frame=Number(slider.value);draw()};document.querySelector('#play').onclick=e=>{playing=!playing;e.target.textContent=playing?'Pause':'Play'};setInterval(()=>{if(playing&&!document.hidden){frame=frame%15+1;draw()}},120);document.querySelector('#play').textContent=playing?'Pause':'Play';draw();</script></html>
